<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurantes</title>
    <script src="index.js"></script>
    <style>
        #restaurante {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1rem;
        }
        .restaurante-card {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 1rem;
        }
        .restaurante-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 4px;
        }
        .restaurante-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Restaurantes</h1>

    <form id="filtros" onsubmit="return false;">
        <select id="cocina">
            <option value="">Todas las cocinas</option>
        </select>
        <input type="text" id="buscar" placeholder="Buscar...">
    </form>

    <div id="paginacion">
        <button id="anterior">Anterior</button>
        <span id="pagina">Página 1</span>
        <button id="siguiente">Siguiente</button>
    </div>

    <div id="restaurante"></div>
</body>
</html>
